name: Verify offline app
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :budget-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Fail if the app requests network access
        run: |
          if grep -q 'android.permission.INTERNET' android-app/build/intermediates/merged_manifests/debug/*/AndroidManifest.xml 2>/dev/null \
             || grep -rq 'android.permission.INTERNET' android-app/build/intermediates/merged_manifests/debug 2>/dev/null; then
            echo "INTERNET permission found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
