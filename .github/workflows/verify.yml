name: Verify renewed app
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: npm ci
      - run: ./gradlew :app:assembleEmulatorDebug :app:lintEmulatorDebug :app:testEmulatorDebugUnitTest :budget-core:test :processor:installDist
      - run: npx firebase emulators:exec --project demo-iptek --only auth,firestore,storage "node scripts/integration.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-apk
          path: android-app/build/outputs/apk/emulator/debug/*.apk
