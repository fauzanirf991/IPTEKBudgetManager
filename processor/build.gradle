plugins { id 'application' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
application { mainClass = 'com.fauzan.budget.server.Server' }
dependencies {
    implementation project(':budget-core')
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.register('admin', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.fauzan.budget.server.AdminTool'
    if (project.hasProperty('adminArgs')) args project.property('adminArgs').split(' ')
}
tasks.register('migrate', JavaExec) {
    workingDir rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.fauzan.budget.server.MigrationTool'
    if (project.hasProperty('migrationArgs')) args project.property('migrationArgs').split(' ')
}
